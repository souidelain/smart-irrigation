<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Irrigation | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f0f2f5; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">Smart <span class="text-emerald-500">Irrigation</span></h1>
                <p class="text-slate-500">Monitoring en temps réel</p>
            </div>
            <div id="status-badge" class="px-4 py-2 rounded-full bg-emerald-100 text-emerald-700 text-sm font-semibold flex items-center gap-2">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                SYSTÈME CONNECTÉ
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Moisture Card -->
            <div class="glass p-6 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-emerald-50 rounded-lg text-emerald-500 text-2xl"><i class="fas fa-droplet"></i></div>
                    <div>
                        <p class="text-sm text-slate-500 uppercase tracking-wider">Humidité Sol</p>
                        <h2 id="moisture" class="text-3xl font-bold text-slate-800">--%</h2>
                    </div>
                </div>
            </div>

            <!-- Temp Card -->
            <div class="glass p-6 rounded-2xl shadow-sm border-l-4 border-orange-400">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-orange-50 rounded-lg text-orange-400 text-2xl"><i class="fas fa-temperature-high"></i></div>
                    <div>
                        <p class="text-sm text-slate-500 uppercase tracking-wider">Température</p>
                        <h2 id="temp" class="text-3xl font-bold text-slate-800">--°C</h2>
                    </div>
                </div>
            </div>

            <!-- Pump Card -->
            <div id="pump-card" class="glass p-6 rounded-2xl shadow-sm border-l-4 border-slate-400 transition-all duration-500">
                <div class="flex items-center gap-4">
                    <div id="pump-icon" class="p-3 bg-slate-50 rounded-lg text-slate-400 text-2xl"><i class="fas fa-faucet"></i></div>
                    <div>
                        <p class="text-sm text-slate-500 uppercase tracking-wider">État Pompe</p>
                        <h2 id="pump-status" class="text-3xl font-bold text-slate-800 uppercase tracking-tighter">--</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- History Log -->
        <div class="glass rounded-2xl shadow-sm overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-semibold text-slate-800">Historique des Lectures</h3>
                <span class="text-xs text-slate-400">Mise à jour toutes les 3s</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 text-slate-500 text-xs uppercase">
                        <tr>
                            <th class="p-4">Heure</th>
                            <th class="p-4">Humidité</th>
                            <th class="p-4">Température</th>
                            <th class="p-4">Action IA</th>
                        </tr>
                    </thead>
                    <tbody id="history-body" class="text-sm text-slate-600 divide-y divide-slate-50">
                        <!-- Data rows here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchData() {
            try {
                const res = await fetch('http://127.0.0.1:5000/api/history');
                const data = await res.json();
                if (data.length === 0) return;

                const last = data[data.length - 1];
                
                // Update Main Stats
                document.getElementById('moisture').innerText = last.moisture + "%";
                document.getElementById('temp').innerText = last.temperature + "°C";
                
                const pStatus = last.pump_action;
                const pElem = document.getElementById('pump-status');
                const pCard = document.getElementById('pump-card');
                const pIcon = document.getElementById('pump-icon');

                pElem.innerText = pStatus;
                if(pStatus === 'ON') {
                    pCard.className = "glass p-6 rounded-2xl shadow-md border-l-4 border-blue-500 bg-blue-50/50";
                    pIcon.className = "p-3 bg-blue-500 rounded-lg text-white text-2xl animate-pulse";
                    pElem.className = "text-3xl font-bold text-blue-600 uppercase tracking-tighter";
                } else {
                    pCard.className = "glass p-6 rounded-2xl shadow-sm border-l-4 border-slate-400";
                    pIcon.className = "p-3 bg-slate-50 rounded-lg text-slate-400 text-2xl";
                    pElem.className = "text-3xl font-bold text-slate-800 uppercase tracking-tighter";
                }

                // Update Table (Last 5 records)
                const tbody = document.getElementById('history-body');
                tbody.innerHTML = data.slice(-5).reverse().map(row => `
                    <tr>
                        <td class="p-4 text-slate-400">${row.received_at.split(' ')[1]}</td>
                        <td class="p-4 font-semibold">${row.moisture}%</td>
                        <td class="p-4">${row.temperature}°C</td>
                        <td class="p-4">
                            <span class="px-2 py-1 rounded text-xs font-bold ${row.pump_action === 'ON' ? 'bg-blue-100 text-blue-600' : 'bg-slate-100 text-slate-500'}">
                                ${row.pump_action}
                            </span>
                        </td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error("Error fetching data:", err);
                document.getElementById('status-badge').className = "px-4 py-2 rounded-full bg-red-100 text-red-700 text-sm font-semibold flex items-center gap-2";
                document.getElementById('status-badge').innerHTML = "BACKEND DISCONNECTED";
            }
        }
        setInterval(fetchData, 3000);
        fetchData();
    </script>
</body>
</html>
